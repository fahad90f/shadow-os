# Shadow OS build and test pipeline.
#
#   tests          the suites that need no build or image (tests/run-suites.sh):
#                  unit tests with stand-ins and static checks as a user, then
#                  as root with the network-namespace suites; a skip fails it
#   iso-amd64      packages + desktop ISO, boot tests (UEFI, Secure Boot, BIOS,
#                  graphical session), uploads the ISO
#   install-amd64  the installer scenario matrix against that ISO, each one
#                  followed by booting the installed disk
#   kernel         the SHADOW kernel packages for amd64 and arm64
#   iso-arm64      packages + ISO on a native arm64 runner, UEFI boot test
#
# Signing: a development archive key is generated per run unless the
# SHADOW_SIGNING_KEY secret holds an ASCII-armoured release key. Private keys
# never live in the repository.
#
# This pipeline publishes nothing for installed systems: the update site is
# built and uploaded with scripts/publish-updates.sh
# (docs/packaging/online-updates.md). Images built here with a development
# key ship the SHADOW APT source disabled, because they could not verify it.
name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SHADOW_JOBS: "4"
  # Package versions are <release>.build<run number>, so every run is an
  # upgrade over the one before it.
  SHADOW_BUILD_ID: ${{ github.run_number }}
  # Empty: the SHADOW APT source stays disabled unless the release key is
  # imported below.
  SHADOW_REPO_URL: ""

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iptables conntrack iproute2 util-linux \
            shellcheck libxml2-utils

      # Root-only parts of these suites skip themselves here; they run in the
      # next step.
      - name: Unit suites and static checks (as a user)
        run: tests/run-suites.sh --user --log-dir "$RUNNER_TEMP/suites-user"

      # The same suites as root, and the ones that send real packets. They
      # work in private network, mount and pid namespaces and never change the
      # runner's network. --no-skip: every requirement is installed above, so
      # a suite that skips itself fails the step.
      - name: Namespace suites (root)
        run: sudo tests/run-suites.sh --root --no-skip --log-dir "$RUNNER_TEMP/suites-root"

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-logs
          path: ${{ runner.temp }}/suites-*/*.log
          if-no-files-found: ignore

  iso-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Host tools
        run: sudo scripts/host-setup.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Import release signing key
        env:
          SHADOW_SIGNING_KEY: ${{ secrets.SHADOW_SIGNING_KEY }}
        if: env.SHADOW_SIGNING_KEY != ''
        run: |
          sudo mkdir -p -m 700 /var/lib/shadow-signing
          printf '%s' "$SHADOW_SIGNING_KEY" | sudo gpg --homedir /var/lib/shadow-signing --batch --import
          echo "SHADOW_SIGNING_HOME=/var/lib/shadow-signing" >> "$GITHUB_ENV"
          # Signed with the release key, the image can follow the update
          # site configured in distro/base/shadow.conf.
          repo_url="$(env -u SHADOW_REPO_URL sh -c '. ./distro/base/shadow.conf; printf %s "$SHADOW_REPO_URL"')"
          echo "SHADOW_REPO_URL=$repo_url" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          python3 scripts/gen-tokens.py check
          python3 tests/installation/test_plan.py
          python3 arsenal/tools/validate.py

      - name: Build chroot
        run: sudo -E build/chroot/create.sh --arch amd64

      # in_chroot's resolver handling (build/lib/common.sh), which every image
      # step relies on, on an overlay of the chroot just made (it stays
      # unchanged). Exit 77 (skipped) fails the step too.
      - name: Image build resolver test
        run: sudo tests/build/in-chroot-resolver-test.sh build/work/chroot-build-amd64

      # Every package the image's Arsenal metapackages depend on is in the
      # chroot's APT sources; otherwise "Build desktop ISO" fails hours later
      # (docs/limitations.md: control.in's shadow-arsenal-pentest).
      - name: Arsenal dependencies in the image's sources
        run: |
          SHADOW_TEST_APT_LISTS=build/work/chroot-build-amd64/var/lib/apt/lists \
            python3 tests/build/test_arsenal_image_packages.py -v

      - name: Build packages
        run: sudo -E build/packages/build.sh

      - name: Publish repository
        run: sudo -E build/packages/repo.sh

      # The Shadow Assistant's offline voice engine data (~700 MB of pinned,
      # sha256-checked downloads, build/iso/voice-data.sh) is cached between
      # runs, keyed on the pinned artifact list, so it is downloaded once per
      # change of that list. Pull requests build the image without it.
      - name: Voice engine cache key
        id: voicekey
        run: |
          key=$(sed -n '/^ARTIFACTS="/,/"$/p' applications/assistant/voice/shadow-voice-setup | sha256sum | cut -c1-16)
          echo "key=voice-engine-$key" >> "$GITHUB_OUTPUT"

      - name: Voice engine download cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: build/work/cache/voice-engine
          key: ${{ steps.voicekey.outputs.key }}

      - name: Build desktop ISO
        env:
          # pull requests: without the voice data; release tags: it must be in the image
          SHADOW_IMAGE_VOICE: ${{ github.event_name == 'pull_request' && '0' || (startsWith(github.ref, 'refs/tags/v') && 'required' || '1') }}
        run: sudo -E build/iso/build.sh --variant desktop

      - name: Verify ISO checksum
        run: cd build/out/iso && sha256sum -c shadow-os-*-amd64.iso.sha256

      - name: Upload packages and repository
        uses: actions/upload-artifact@v4
        with:
          name: shadow-packages-amd64
          path: |
            build/out/packages/*.deb
            build/out/repo/**
          retention-days: 30
          compression-level: 6

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-iso
          path: |
            build/out/iso/shadow-os-*-amd64.iso
            build/out/iso/shadow-os-*-amd64.iso.sha256
            build/out/iso/shadow-os-*-amd64.manifest
          retention-days: 30
          compression-level: 0

      - name: Boot test — UEFI, graphical session
        run: |
          sudo -E python3 -u tests/desktop/test_desktop_boot.py \
            --iso "$(ls build/out/iso/shadow-os-*-amd64.iso)" --shots build/out/shots --keys

      - name: Boot test — UEFI Secure Boot (CD and USB)
        run: |
          iso="$(ls build/out/iso/shadow-os-*-amd64.iso)"
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware uefi-secureboot --media cdrom
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware uefi-secureboot --media usb

      - name: Boot test — legacy BIOS (CD and USB)
        run: |
          iso="$(ls build/out/iso/shadow-os-*-amd64.iso)"
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware bios --media cdrom
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware bios --media usb

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-bootlogs
          path: |
            build/work/tests/**/*.serial.log
            build/work/tests/**/*.qemu.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-screenshots
          path: build/out/shots/*.png
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Shadow OS ${GITHUB_REF_NAME}" --generate-notes \
            build/out/iso/shadow-os-*-amd64.iso build/out/iso/shadow-os-*-amd64.iso.sha256 \
            build/out/iso/shadow-os-*-amd64.manifest

  install-amd64:
    needs: iso-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        combo:
          - erase:uefi
          - erase-luks:uefi
          - erase:uefi-secureboot
          - erase:bios
          - alongside:uefi
          - manual:uefi
          - manual:bios
          - erase-home:uefi
          - refuse:uefi
    steps:
      - uses: actions/checkout@v4
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ipxe-qemu python3-pil imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: actions/download-artifact@v4
        with:
          name: shadow-os-amd64-iso
          path: iso
      - name: Install scenario ${{ matrix.combo }}
        run: |
          combo='${{ matrix.combo }}'
          sudo python3 -u tests/installation/test_install.py --iso "$(ls iso/shadow-os-*-amd64.iso)" \
            --scenario "${combo%%:*}" --firmware "${combo##*:}" --workdir "$PWD/work"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ strategy.job-index }}
          path: work/**/*.log
          if-no-files-found: ignore

  kernel:
    # Each architecture is built on a native runner: Debian ships the kernel
    # configuration of an architecture only in that architecture's package.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Host tools
        run: sudo scripts/host-setup.sh --no-test-tools
      - name: Build the SHADOW kernel (${{ matrix.arch }})
        env:
          SHADOW_KERNEL_DEBUGINFO: none
        run: sudo -E kernel/build.sh --arch ${{ matrix.arch }} --jobs 4
      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: shadow-kernel-${{ matrix.arch }}
          path: |
            build/out/packages/linux-*.deb
            build/out/kernel/config-*
          retention-days: 30

  iso-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /
      - name: Host tools
        run: |
          sudo scripts/host-setup.sh --no-test-tools
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils ipxe-qemu
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM on this runner: the boot test runs emulated"
      - name: Build chroot
        run: sudo -E build/chroot/create.sh --arch arm64
      - name: Build packages
        run: sudo -E build/packages/build.sh --arch arm64
      - name: Publish repository
        run: sudo -E build/packages/repo.sh
      - name: Build desktop ISO
        run: sudo -E build/iso/build.sh --arch arm64 --variant desktop
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-arm64-iso
          path: |
            build/out/iso/shadow-os-*-arm64.iso
            build/out/iso/shadow-os-*-arm64.iso.sha256
            build/out/iso/shadow-os-*-arm64.manifest
          retention-days: 30
          compression-level: 0
      - name: Boot test — UEFI (AAVMF)
        run: |
          sudo -E python3 -u tests/boot/test_live_boot.py --arch arm64 \
            --iso "$(ls build/out/iso/shadow-os-*-arm64.iso)" --firmware uefi
