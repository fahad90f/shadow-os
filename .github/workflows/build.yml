# Shadow OS build and test pipeline.
#
#   iso-amd64      packages + desktop ISO, boot tests (UEFI, Secure Boot, BIOS,
#                  graphical session), uploads the ISO
#   install-amd64  the installer scenario matrix against that ISO, each one
#                  followed by booting the installed disk
#   kernel         the SHADOW kernel packages for amd64 and arm64
#   iso-arm64      packages + ISO on a native arm64 runner, UEFI boot test
#   pages          the amd64 package repository on GitHub Pages, where
#                  installed systems get it with APT (the website that
#                  presents it is website/, deployed separately)
#
# Signing: a development archive key is generated per run unless the
# SHADOW_SIGNING_KEY secret holds an ASCII-armoured release key. Private keys
# never live in the repository. The update site is only published with the
# release key: installed systems could not verify a per-run key
# (docs/packaging/repositories.md).
name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# A newer push supersedes a running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SHADOW_JOBS: "4"
  # Package versions are <release>+build<run number>, so every run is an
  # upgrade over the one before it.
  SHADOW_BUILD_ID: ${{ github.run_number }}

jobs:
  iso-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      release_signed: ${{ steps.signing.outputs.release_signed }}
      repo_url: ${{ steps.signing.outputs.repo_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Host tools
        run: sudo scripts/host-setup.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Import release signing key
        id: signing
        env:
          SHADOW_SIGNING_KEY: ${{ secrets.SHADOW_SIGNING_KEY }}
        if: env.SHADOW_SIGNING_KEY != ''
        run: |
          sudo mkdir -p -m 700 /var/lib/shadow-signing
          printf '%s' "$SHADOW_SIGNING_KEY" | sudo gpg --homedir /var/lib/shadow-signing --batch --import
          echo "SHADOW_SIGNING_HOME=/var/lib/shadow-signing" >> "$GITHUB_ENV"
          # The update site of this repository (GitHub Pages); the packages
          # and the image are built pointing at it.
          repo_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "SHADOW_REPO_URL=$repo_url" >> "$GITHUB_ENV"
          echo "repo_url=$repo_url" >> "$GITHUB_OUTPUT"
          echo "release_signed=true" >> "$GITHUB_OUTPUT"

      - name: Static checks
        run: |
          python3 scripts/gen-tokens.py check
          python3 tests/installation/test_plan.py
          python3 arsenal/tools/validate.py

      - name: Build chroot
        run: sudo -E build/chroot/create.sh --arch amd64

      - name: Build packages
        run: sudo -E build/packages/build.sh

      - name: Publish repository
        run: sudo -E build/packages/repo.sh

      - name: Build desktop ISO
        run: sudo -E build/iso/build.sh --variant desktop

      - name: Verify ISO checksum
        run: cd build/out/iso && sha256sum -c shadow-os-*-amd64.iso.sha256

      - name: Upload packages and repository
        uses: actions/upload-artifact@v4
        with:
          name: shadow-packages-amd64
          path: |
            build/out/packages/*.deb
            build/out/repo/**
          retention-days: 30
          compression-level: 6

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-iso
          path: |
            build/out/iso/shadow-os-*-amd64.iso
            build/out/iso/shadow-os-*-amd64.iso.sha256
            build/out/iso/shadow-os-*-amd64.manifest
          retention-days: 30
          compression-level: 0

      - name: Boot test — UEFI, graphical session
        run: |
          sudo -E python3 -u tests/desktop/test_desktop_boot.py \
            --iso "$(ls build/out/iso/shadow-os-*-amd64.iso)" --shots build/out/shots --keys

      - name: Boot test — UEFI Secure Boot (CD and USB)
        run: |
          iso="$(ls build/out/iso/shadow-os-*-amd64.iso)"
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware uefi-secureboot --media cdrom
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware uefi-secureboot --media usb

      - name: Boot test — legacy BIOS (CD and USB)
        run: |
          iso="$(ls build/out/iso/shadow-os-*-amd64.iso)"
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware bios --media cdrom
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware bios --media usb

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-bootlogs
          path: |
            build/work/tests/**/*.serial.log
            build/work/tests/**/*.qemu.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-amd64-screenshots
          path: build/out/shots/*.png
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Shadow OS ${GITHUB_REF_NAME}" --generate-notes \
            build/out/iso/shadow-os-*-amd64.iso build/out/iso/shadow-os-*-amd64.iso.sha256 \
            build/out/iso/shadow-os-*-amd64.manifest

  install-amd64:
    needs: iso-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        combo:
          - erase:uefi
          - erase-luks:uefi
          - erase:uefi-secureboot
          - erase:bios
          - alongside:uefi
          - manual:uefi
          - manual:bios
          - erase-home:uefi
          - refuse:uefi
    steps:
      - uses: actions/checkout@v4
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ipxe-qemu python3-pil imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: actions/download-artifact@v4
        with:
          name: shadow-os-amd64-iso
          path: iso
      - name: Install scenario ${{ matrix.combo }}
        run: |
          combo='${{ matrix.combo }}'
          sudo python3 -u tests/installation/test_install.py --iso "$(ls iso/shadow-os-*-amd64.iso)" \
            --scenario "${combo%%:*}" --firmware "${combo##*:}" --workdir "$PWD/work"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ strategy.job-index }}
          path: work/**/*.log
          if-no-files-found: ignore

  kernel:
    # Each architecture is built on a native runner: Debian ships the kernel
    # configuration of an architecture only in that architecture's package.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Host tools
        run: sudo scripts/host-setup.sh --no-test-tools
      - name: Build the SHADOW kernel (${{ matrix.arch }})
        env:
          SHADOW_KERNEL_DEBUGINFO: none
        run: sudo -E kernel/build.sh --arch ${{ matrix.arch }} --jobs 4
      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: shadow-kernel-${{ matrix.arch }}
          path: |
            build/out/packages/linux-*.deb
            build/out/kernel/config-*
          retention-days: 30

  iso-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /
      - name: Host tools
        run: |
          sudo scripts/host-setup.sh --no-test-tools
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils ipxe-qemu
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM on this runner: the boot test runs emulated"
      - name: Build chroot
        run: sudo -E build/chroot/create.sh --arch arm64
      - name: Build packages
        run: sudo -E build/packages/build.sh --arch arm64
      - name: Publish repository
        run: sudo -E build/packages/repo.sh
      - name: Build desktop ISO
        run: sudo -E build/iso/build.sh --arch arm64 --variant desktop
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shadow-os-arm64-iso
          path: |
            build/out/iso/shadow-os-*-arm64.iso
            build/out/iso/shadow-os-*-arm64.iso.sha256
            build/out/iso/shadow-os-*-arm64.manifest
          retention-days: 30
          compression-level: 0
      - name: Boot test — UEFI (AAVMF)
        run: |
          sudo -E python3 -u tests/boot/test_live_boot.py --arch arm64 \
            --iso "$(ls build/out/iso/shadow-os-*-arm64.iso)" --firmware uefi

  # The signed Shadow package repository on GitHub Pages, so installed
  # systems update Shadow packages with "apt upgrade" / Shadow Updater. Runs
  # after the image built from these packages has passed its
  # boot tests, and only when they were signed with the release key.
  # Requires: Settings -> Pages -> Source: GitHub Actions, and the
  # SHADOW_SIGNING_KEY secret (see docs/packaging/online-updates.md).
  pages:
    needs: iso-amd64
    if: >-
      needs.iso-amd64.outputs.release_signed == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/awesome-ritchie-t7kh7s' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shadow-packages-amd64
          path: site
      - name: Assemble the repository for publishing
        run: |
          # The artifact holds packages/ and repo/. Published: repo/, repo.json
          # (what the website in website/ shows) and the script that switches
          # older installations over. SHADOW_SITE_URL is an optional repository
          # variable: the address the website is deployed at.
          python3 scripts/gen-repo-site.py --repo site/repo --out public \
            --url "${{ needs.iso-amd64.outputs.repo_url }}" \
            --build "$SHADOW_BUILD_ID" --commit "$GITHUB_SHA" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --site-url "${{ vars.SHADOW_SITE_URL }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
