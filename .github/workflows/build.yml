# Builds the NEXUS OS packages and the amd64 desktop ISO, boots the ISO in
# QEMU and publishes it as a workflow artifact (and as a release asset for
# version tags).
#
# The ISO is signed with a development archive key generated during the run
# unless a release key is provided through the NEXUS_SIGNING_KEY secret (an
# ASCII-armoured private key without passphrase). Private keys never live in
# the repository.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NEXUS_JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Host tools
        run: sudo scripts/host-setup.sh

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Import release signing key
        env:
          NEXUS_SIGNING_KEY: ${{ secrets.NEXUS_SIGNING_KEY }}
        if: env.NEXUS_SIGNING_KEY != ''
        run: |
          sudo mkdir -p -m 700 /var/lib/nexus-signing
          printf '%s' "$NEXUS_SIGNING_KEY" | sudo gpg --homedir /var/lib/nexus-signing --batch --import
          echo "NEXUS_SIGNING_HOME=/var/lib/nexus-signing" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          python3 scripts/gen-tokens.py check
          python3 tests/installation/test_plan.py
          python3 arsenal/tools/validate.py

      - name: Build chroot
        run: sudo -E build/chroot/create.sh --arch amd64

      - name: Build packages
        run: sudo -E build/packages/build.sh

      - name: Publish repository
        run: sudo -E build/packages/repo.sh

      - name: Build desktop ISO
        run: sudo -E build/iso/build.sh --variant desktop

      - name: Verify ISO checksum
        run: cd build/out/iso && sha256sum -c nexus-os-*-amd64.iso.sha256

      - name: Boot test (UEFI, graphical session)
        run: |
          sudo -E python3 -u tests/desktop/test_desktop_boot.py \
            --iso "$(ls build/out/iso/nexus-os-*-amd64.iso)" --shots build/out/shots

      - name: Boot test (UEFI Secure Boot, BIOS)
        run: |
          iso="$(ls build/out/iso/nexus-os-*-amd64.iso)"
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware uefi-secureboot
          sudo -E python3 -u tests/boot/test_live_boot.py --iso "$iso" --firmware bios

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-amd64
          path: |
            build/out/iso/nexus-os-*-amd64.iso
            build/out/iso/nexus-os-*-amd64.iso.sha256
            build/out/iso/nexus-os-*-amd64.manifest
            build/out/shots/*.png
          retention-days: 14
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "NEXUS OS ${GITHUB_REF_NAME}" --generate-notes \
            build/out/iso/nexus-os-*-amd64.iso build/out/iso/nexus-os-*-amd64.iso.sha256 \
            build/out/iso/nexus-os-*-amd64.manifest
