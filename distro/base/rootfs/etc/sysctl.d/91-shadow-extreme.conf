# Shadow OS — extreme kernel hardening sysctl parameters.
# Installed as /etc/sysctl.d/91-shadow-extreme.conf.
# Applied at boot by systemd-sysctl and at runtime by shadow-harden.
#
# Companion to 90-shadow-anon.conf (network + BPF + ptrace + rp_filter).
# This file covers: BPF restrictions, user namespaces, ASLR, filesystem
# protections, core dumps, TTY discipline, userfaultfd, TCP hardening,
# ICMP hardening, and IPv6 router-advertisement restrictions.

# ---------------------------------------------------------------------------
# BPF and user namespaces
# ---------------------------------------------------------------------------

# Disable unprivileged BPF — closes a large local privilege-escalation surface.
kernel.unprivileged_bpf_disabled = 1

# Disable unprivileged user namespaces (Debian-specific sysctl).
# Many container escapes rely on creating user namespaces without privilege.
kernel.unprivileged_userns_clone = 0

# ---------------------------------------------------------------------------
# Performance events
# ---------------------------------------------------------------------------

# Restrict perf_event_open to CAP_PERFMON / root only.
# Level 3 = only root; prevents microarchitectural side-channel leaks.
kernel.perf_event_paranoid = 3

# ---------------------------------------------------------------------------
# Address space layout randomisation
# ---------------------------------------------------------------------------

# Full ASLR: randomise base addresses of mmap, stack, VDSO and heap.
kernel.randomize_va_space = 2

# ---------------------------------------------------------------------------
# Magic SysRq key
# ---------------------------------------------------------------------------

# Allow only sync (s) and remount-ro (u) in emergency — not full debug access.
# 4 = enable sync command only; 0 = fully disabled.
kernel.sysrq = 4

# ---------------------------------------------------------------------------
# Filesystem hardening
# ---------------------------------------------------------------------------

# Prevent hard-link attacks (e.g. a low-priv user hardlinking /etc/shadow).
fs.protected_hardlinks = 1

# Prevent symlink attacks in world-writable directories like /tmp.
fs.protected_symlinks = 1

# Restrict FIFO creation in world-writable sticky directories.
fs.protected_fifos = 2

# Restrict regular file creation in world-writable sticky directories.
fs.protected_regular = 2

# Disable core dumps for setuid binaries (leaks memory of privileged processes).
fs.suid_dumpable = 0

# ---------------------------------------------------------------------------
# Core dumps
# ---------------------------------------------------------------------------

# Include PID in core file name to avoid overwriting in concurrent crashes.
kernel.core_uses_pid = 1

# Route all core dumps to /bin/false — effectively disables them system-wide.
# Prevents sensitive memory content from landing on disk.
kernel.core_pattern = |/bin/false

# ---------------------------------------------------------------------------
# TTY line discipline
# ---------------------------------------------------------------------------

# Prevent unprivileged users from loading kernel TTY line disciplines.
# Historically exploited in privilege-escalation chains.
dev.tty.ldisc_autoload = 0

# ---------------------------------------------------------------------------
# Userfaultfd
# ---------------------------------------------------------------------------

# Restrict userfaultfd to privileged users only.
# Unprivileged userfaultfd has been used to slow kernel race windows.
vm.unprivileged_userfaultfd = 0

# ---------------------------------------------------------------------------
# TCP hardening
# ---------------------------------------------------------------------------

# Enable SYN cookies — mitigates SYN flood denial-of-service attacks.
net.ipv4.tcp_syncookies = 1

# RFC 1337 fix: drop RST packets for TIME_WAIT connections.
net.ipv4.tcp_rfc1337 = 1

# ---------------------------------------------------------------------------
# ICMP / routing hardening
# ---------------------------------------------------------------------------

# Log packets from impossible source addresses (martians) for intrusion detection.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Reject ICMP redirects claiming to be from gateways — MITM prevention.
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Suppress bogus ICMP error responses to avoid log spam and information leaks.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ---------------------------------------------------------------------------
# IPv6 — disable router advertisements
# ---------------------------------------------------------------------------

# Do not auto-configure addresses from router advertisements.
# Prevents rogue-router attacks that redirect IPv6 traffic.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Reject IPv6 source-routed packets (mirrors the IPv4 setting in 90-shadow-anon.conf).
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
