# Shadow OS kernel hardening — deployed by shadow-anon ghost mode
# Applied at boot by systemd-sysctl and on-demand by shadow-anon harden-kernel

# Disable TCP timestamps (prevents remote uptime/fingerprint inference)
net.ipv4.tcp_timestamps = 0

# Disable IP source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable ICMP redirects (prevents MITM route injection)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Reverse-path filter (drop spoofed packets)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Hide kernel symbol addresses from unprivileged users
kernel.kptr_restrict = 2

# Restrict dmesg to root
kernel.dmesg_restrict = 1

# BPF JIT hardening (mitigates speculative execution attacks)
net.core.bpf_jit_harden = 2

# Restrict ptrace (prevents process injection by non-root/non-parent)
kernel.yama.ptrace_scope = 1

# Minimal swap usage (reduce sensitive data written to disk)
vm.swappiness = 1
