# Shadow OS — kernel module blacklist.
# Installed as /etc/modprobe.d/shadow-blacklist.conf.
# Applied by the initramfs (update-initramfs) and at runtime.
#
# Each group is blacklisted because the modules are either unused on a modern
# desktop system or have contributed significant attack-surface / CVE history
# that makes their presence unjustifiable when not needed.

# ---------------------------------------------------------------------------
# Legacy / unused filesystems
# ---------------------------------------------------------------------------
# cramfs   — compressed ROM FS; no modern use; multiple historical CVEs.
# freevxfs — Veritas VxFS; forensics tool; CVEs in read path.
# jffs2    — NAND flash FS; not used on x86 desktops; heap overflow CVEs.
# hfs      — Apple HFS; rarely mounted; type-confusion CVEs.
# hfsplus  — Apple HFS+; same situation; multiple kernel memory-corruption bugs.
# squashfs — read-only compressed FS; attack surface for malicious images if
#            user mounts untrusted media; override per-connection when needed.
# udf      — Universal Disk Format; optical media FS; buffer-overflow history.

install cramfs     /bin/false
install freevxfs   /bin/false
install jffs2      /bin/false
install hfs        /bin/false
install hfsplus    /bin/false
install squashfs   /bin/false
install udf        /bin/false

# ---------------------------------------------------------------------------
# Unused network protocols
# ---------------------------------------------------------------------------
# Each protocol below has had multiple remote or local CVEs. Desktop systems
# use TCP/IP (IPv4 + IPv6); none of these are needed in that scenario.
#
# dccp     — Datagram Congestion Control Protocol; remote kernel exploits.
# sctp     — Stream Control Transmission Protocol; large attack surface; CVEs.
# rds      — Reliable Datagram Sockets; local privilege escalation CVEs.
# tipc     — Transparent Inter-Process Communication; cluster networking only.
# n-hdlc   — HDLC async discipline; serial-line protocol; CVE in line discipline.
# ax25     — Amateur radio AX.25; not needed on modern desktops.
# netrom   — NET/ROM amateur radio; same reasoning as ax25.
# x25      — X.25 WAN protocol; legacy; integer-overflow CVEs.
# rose     — ROSE amateur radio; legacy; not needed.
# decnet   — DECnet; completely obsolete; CVEs.
# econet   — Acorn Econet; completely obsolete; privilege escalation CVE.
# af_802154— IEEE 802.15.4 (Zigbee etc.); IoT/embedded, not desktop.
# ipx      — Novell IPX; completely obsolete.
# appletalk— AppleTalk; completely obsolete.
# psnap    — Sub-Network Access Protocol; appletalk dependency.
# p8023    — Novell 802.3; obsolete Ethernet framing.
# llc2     — IEEE 802.2 LLC type-2; obsolete.

install dccp      /bin/false
install sctp      /bin/false
install rds       /bin/false
install tipc      /bin/false
install n-hdlc    /bin/false
install ax25      /bin/false
install netrom    /bin/false
install x25       /bin/false
install rose      /bin/false
install decnet    /bin/false
install econet    /bin/false
install af_802154 /bin/false
install ipx       /bin/false
install appletalk /bin/false
install psnap     /bin/false
install p8023     /bin/false
install llc2      /bin/false

# ---------------------------------------------------------------------------
# FireWire and Thunderbolt — DMA attack vectors
# ---------------------------------------------------------------------------
# FireWire (IEEE 1394) and Thunderbolt allow direct memory access (DMA).
# A physical attacker with a FireWire/Thunderbolt device can read and write
# arbitrary system RAM, bypassing all OS-level memory protection. This is
# the basis of tools like inception and pcileech. Blacklist unless explicitly
# needed; re-enable in /etc/modprobe.d/local.conf if a device is required.

install firewire-core  /bin/false
install firewire-ohci  /bin/false
install firewire-sbp2  /bin/false
install thunderbolt    /bin/false

# ---------------------------------------------------------------------------
# CAN bus (automotive / industrial protocols)
# ---------------------------------------------------------------------------
# CAN bus is used in vehicle ECUs and industrial controllers. Desktop systems
# have no use for it. The in-kernel CAN implementation has had memory-safety
# issues and presents unnecessary attack surface.

install can      /bin/false
install can_raw  /bin/false
install can_bcm  /bin/false
install can_isotp /bin/false
