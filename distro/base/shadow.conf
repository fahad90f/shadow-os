# Shadow OS — single source of truth for distribution identity.
# Sourced by the build system (POSIX sh syntax, KEY=value only) and rendered
# into /etc/os-release, boot menus, installer branding and package versions.

SHADOW_NAME="Shadow OS"
SHADOW_ID="shadow"
SHADOW_VERSION="0.2.0"
SHADOW_CODENAME="obsidian"
SHADOW_CHANNEL="dev"            # dev | testing | stable  (see distro/release/channels.md)
SHADOW_DESKTOP="Shadow Horizon"
SHADOW_VENDOR="Shadow"

# Upstream base. Shadow OS tracks Debian Stable; exactly one Debian suite is
# ever enabled — no mixing with testing/unstable or other distributions.
SHADOW_DEBIAN_SUITE="trixie"
SHADOW_DEBIAN_VERSION="13"

# Supported architectures (Debian names). Each has its own build config under
# build/<arch>/ and kernel/<arch>/ and its own test record under tests/.
SHADOW_ARCHES="amd64 arm64"

# Upstream kernel series the SHADOW kernel is derived from (Debian's packaged
# longterm series for the suite above).
SHADOW_KERNEL_SERIES="6.12"

# Project URLs. SHADOW_REPO_URL is the address the SHADOW packages are
# published at (scripts/publish-updates.sh --url sets it). While it is empty,
# images ship the SHADOW APT source disabled instead of pointing at a host
# that does not exist. An empty SHADOW_REPO_URL in the environment overrides
# the value here.
SHADOW_HOME_URL="https://github.com/fahad90fa/Custom-OS"
SHADOW_BUG_URL="https://github.com/fahad90fa/Custom-OS/issues"
: "${SHADOW_REPO_URL=}"
