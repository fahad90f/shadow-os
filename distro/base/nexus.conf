# NEXUS OS — single source of truth for distribution identity.
# Sourced by the build system (POSIX sh syntax, KEY=value only) and rendered
# into /etc/os-release, boot menus, installer branding and package versions.

NEXUS_NAME="NEXUS OS"
NEXUS_ID="nexus"
NEXUS_VERSION="0.1.0"
NEXUS_CODENAME="obsidian"
NEXUS_CHANNEL="dev"            # dev | testing | stable  (see distro/release/channels.md)
NEXUS_DESKTOP="NEXUS HORIZON"
NEXUS_VENDOR="NEXUS"

# Upstream base. NEXUS OS tracks Debian Stable; exactly one Debian suite is
# ever enabled — no mixing with testing/unstable or other distributions.
NEXUS_DEBIAN_SUITE="trixie"
NEXUS_DEBIAN_VERSION="13"

# Supported architectures (Debian names). Each has its own build config under
# build/<arch>/ and kernel/<arch>/ and its own test record under tests/.
NEXUS_ARCHES="amd64 arm64"

# Upstream kernel series the NEXUS kernel is derived from (Debian's packaged
# longterm series for the suite above).
NEXUS_KERNEL_SERIES="6.12"

# Project URLs. NEXUS_REPO_URL is intentionally empty until a repository is
# actually published; images built without it ship the NEXUS APT source
# disabled instead of pointing at a host that does not exist.
NEXUS_HOME_URL="https://github.com/fahad90fa/Custom-OS"
NEXUS_BUG_URL="https://github.com/fahad90fa/Custom-OS/issues"
: "${NEXUS_REPO_URL:=}"
