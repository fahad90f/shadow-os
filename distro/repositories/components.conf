# Which repository component a SHADOW binary package is published in.
# First matching shell pattern wins; anything unmatched goes to "core".
#
#   core       the operating system: base files, boot, installer, desktop,
#              system applications
#   security   the security arsenal: tool profiles (metapackages) and tools
#              packaged by SHADOW because Debian does not ship them
#   community  contributed packages (see CONTRIBUTING.md); empty until the
#              first contribution is accepted
#
# <pattern>            <component>
# The manager and its manifests belong to the base system.
shadow-arsenal          core
shadow-arsenal-data     core
shadow-arsenal-*        security
shadow-tool-*           security
