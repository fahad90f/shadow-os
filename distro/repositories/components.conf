# Which repository component a NEXUS binary package is published in.
# First matching shell pattern wins; anything unmatched goes to "core".
#
#   core       the operating system: base files, boot, installer, desktop,
#              system applications
#   security   the security arsenal: tool profiles (metapackages) and tools
#              packaged by NEXUS because Debian does not ship them
#   community  contributed packages (see CONTRIBUTING.md); empty until the
#              first contribution is accepted
#
# <pattern>            <component>
nexus-arsenal-*        security
nexus-tool-*           security
