#!/usr/sbin/nft -f
# Shadow OS default firewall (nftables).
#
# Policy: this machine is a workstation. Nothing may connect to it unless it
# was asked for; everything it starts itself is allowed out.
#
#   inbound    dropped, except replies, loopback, the ICMP messages a host
#              needs to work, and the ports opened in /etc/shadow-os/firewall.json
#   forwarded  dropped, except for local virtual machines and containers
#   outbound   allowed
#
# Manage it with "shadow-firewall" (or Control Center → Firewall), which
# rewrites /etc/nftables.d/50-shadow-allowed.nft from /etc/shadow-os/firewall.json
# and validates the whole ruleset before loading it. Your own rules belong in
# additional files under /etc/nftables.d/ — they survive updates of this file.
#
# Only the SHADOW table is replaced when this file is (re)loaded, so tables
# owned by Docker, libvirt or a VPN client are left alone.

table inet shadow_filter
delete table inet shadow_filter

table inet shadow_filter {
    # Filled from /etc/shadow-os/firewall.json by shadow-firewall.
    set allowed_tcp {
        type inet_service
        flags interval
    }
    set allowed_udp {
        type inet_service
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iifname "lo" accept

        # ICMP: errors always; echo requests rate-limited.
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second burst 20 packets accept
        # IPv6 neighbour discovery and multicast listener discovery (link-local only).
        ip6 nexthdr icmpv6 icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept
        ip6 nexthdr icmpv6 icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } ip6 saddr fe80::/10 accept

        # DHCPv6 client replies.
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # Local virtual machines and containers may use the host's DNS and DHCP.
        iifname "virbr*" meta l4proto { tcp, udp } th dport 53 accept
        iifname "virbr*" udp dport 67 accept
        iifname "docker0" meta l4proto { tcp, udp } th dport 53 accept
        iifname "br-*" meta l4proto { tcp, udp } th dport 53 accept
        iifname "podman*" meta l4proto { tcp, udp } th dport 53 accept
        iifname "lxcbr*" meta l4proto { tcp, udp } th dport 53 accept
        iifname "lxcbr*" udp dport 67 accept

        # Ports opened by the administrator.
        tcp dport @allowed_tcp accept
        udp dport @allowed_udp accept

        jump input_local
    }

    # Hook for additional inbound rules from /etc/nftables.d/.
    chain input_local {
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept

        # Traffic of local virtual machines and containers leaving through this host.
        iifname "virbr*" accept
        iifname "docker0" accept
        iifname "br-*" accept
        iifname "podman*" accept
        iifname "lxcbr*" accept
        # Connections the host itself published to them (port forwards).
        oifname "virbr*" ct status dnat accept
        oifname "docker0" ct status dnat accept
        oifname "br-*" ct status dnat accept
        oifname "podman*" ct status dnat accept

        jump forward_local
    }

    chain forward_local {
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

include "/etc/nftables.d/*.nft"
