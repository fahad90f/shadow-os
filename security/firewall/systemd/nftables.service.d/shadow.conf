#
# Installed as /usr/lib/systemd/system/nftables.service.d/shadow.conf by
# shadow-hardening.
#
# Debian's nftables.service stops with "nft flush ruleset", and the nftables
# package's postinst try-restarts the unit on every upgrade. That would
# silently remove every table on the system: the Shadow kill switch
# (inet shadow_egress), a panic (inet shadow_panic), Hide Me's iptables-nft
# chains, Docker's and libvirt's NAT. Stopping the unit now removes only the
# host firewall table it loaded from /etc/nftables.conf.
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet shadow_filter
# If /etc/nftables.conf was edited to "flush ruleset", put an engaged panic and
# the kill switch back at once (shadow-killswitch-watch.timer would within
# 20 s). Both are no-ops when nothing is missing; "-": never fails the
# firewall's start.
ExecStartPost=-/usr/sbin/shadow-panic reassert
ExecStartPost=-/usr/sbin/shadow-killswitch reassert
