# NEXUS OS: do not auto-load rarely used kernel modules.
#
# Installed as /usr/lib/modprobe.d/nexus-hardening.conf.
#
# "blacklist" stops a module from being loaded *implicitly* — for example when
# an unprivileged program opens a socket of an exotic protocol family, which is
# how several past kernel privilege escalations were reached. It does not make
# the module unavailable: root can still load any of these by name
# ("modprobe rds"), which matters on a security workstation where such
# protocols and filesystems are sometimes exactly what is being examined.

# Network protocol families with a history of vulnerabilities and no desktop use
blacklist dccp
blacklist dccp_ipv4
blacklist dccp_ipv6
blacklist rds
blacklist tipc
blacklist n-hdlc
blacklist ax25
blacklist netrom
blacklist x25
blacklist rose
blacklist decnet
blacklist econet
blacklist af_802154
blacklist ipx
blacklist appletalk
blacklist psnap
blacklist p8023
blacklist p8022
blacklist atm

# Legacy filesystems that are never mounted automatically on a desktop
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist bfs
blacklist minix
blacklist qnx4
blacklist qnx6
blacklist sysv
blacklist ufs
