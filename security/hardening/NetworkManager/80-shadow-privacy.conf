# Shadow OS NetworkManager privacy defaults (package shadow-hardening).
# Installed as /usr/lib/NetworkManager/conf.d/80-shadow-privacy.conf; override
# per connection (nmcli/Control Center) or with a file in /etc/NetworkManager/conf.d/.
# "shadow-netprivacy mac {per-boot|per-network|hardware}" writes
# /etc/NetworkManager/conf.d/90-shadow-mac.conf; "shadow-netprivacy status"
# shows what is in force.
#
# Numbers, not words: NetworkManager 1.52 reads most [connection] defaults
# as integers, and a word such as "no" is silently ignored there (the
# property then keeps its built-in default). Only the [main] and [device]
# keys and the *.cloned-mac-address / connection.stable-id / ipv6.dhcp-duid
# strings below take words.

[main]
# DNS goes to systemd-resolved (encrypted DNS, see
# /usr/lib/systemd/resolved.conf.d/80-shadow-privacy.conf). Explicit, so that
# NetworkManager never falls back to writing the network's DNS servers into
# /etc/resolv.conf when that file is not resolved's stub link.
dns=systemd-resolved

[device]
# Random MAC address while scanning for networks.
wifi.scan-rand-mac-address=yes

# Drivers that cannot change the MAC address (Debian's own list in
# /usr/lib/NetworkManager/conf.d/no-mac-addr-change.conf turns their scan
# randomization off): they keep their own address. A named section is
# checked before [connection], whatever file that comes from.
[connection-shadow-mac-fixed-drivers]
match-device=driver:eagle_sdio,driver:wl
wifi.cloned-mac-address=preserve
ethernet.cloned-mac-address=preserve

[connection]
# MAC address: a private address per network and per boot. "stable" derives
# the address from connection.stable-id; ${CONNECTION}/${BOOT} makes it differ
# for every network (no network can link the device to another one) and
# change once per boot (no network can follow the device across days), but it
# stays the same for that network for the whole boot, however often Wi-Fi
# reconnects. Never "random" (a new address at every connection): routers
# then block the "new device" after each reconnect (MAC filters, device
# limits, used-up DHCP pools), log-in pages forget you, and some Wi-Fi chips
# stop receiving after the change - Wi-Fi shows "connected" with no internet.
# Nothing here reconnects a network: a new address is taken when a network
# connects anyway.
# A network that must always see the same address (MAC allowlist, log-in page
# that should remember the device):
#     sudo shadow-netprivacy mac-exception add <connection UUID>
# If a network filters by the real hardware address, set "permanent" on that
# connection only (nmcli connection modify <name> wifi.cloned-mac-address permanent).
connection.stable-id=${CONNECTION}/${BOOT}
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# DHCPv6 client identifier (DUID), from the same stable-id: per network and
# per boot like the MAC address (and new with Hide Me's "rotate identity").
# Unset, NetworkManager sends one DUID made from /etc/machine-id on every
# network and at every boot, which would link all the private addresses above.
ipv6.dhcp-duid=stable-uuid
# Give the DHCP lease back when a connection goes down (1 = yes), so a
# per-boot address does not keep a lease in the router's pool.
ipv4.dhcp-send-release=1
ipv6.dhcp-send-release=1
# IPv6 privacy extensions (2 = temporary addresses, preferred).
ipv6.ip6-privacy=2
# Do not send the hostname to the router in DHCP requests (0 = no).
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
# No LLMNR and no multicast DNS on any network (0 = no): the computer does
# not answer, or announce, its name on the local network.
connection.llmnr=0
connection.mdns=0
# The network's own DNS server (asked only for the network's own names, see
# resolved's Domains=~.) is tried with DNS-over-TLS first (1 = opportunistic).
connection.dns-over-tls=1
