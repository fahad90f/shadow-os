# Shadow OS NetworkManager privacy defaults — extreme level.
# Installed as /usr/lib/NetworkManager/conf.d/80-shadow-privacy.conf; override
# per connection (nmcli/Control Center) or with a file in /etc/NetworkManager/conf.d/.

[device]
# Random MAC address while scanning for networks.
wifi.scan-rand-mac-address=yes

[connection]
# Fully random MAC for every Wi-Fi connection (maximum anonymity).
# If a network filters by hardware address, set permanent on that connection.
wifi.cloned-mac-address=random
# Stable per-network MAC for Ethernet (less disruptive for DHCP leases).
ethernet.cloned-mac-address=stable
# IPv6 privacy extensions (temporary addresses preferred; no stable SLAAC).
ipv6.ip6-privacy=2
# Suppress hostname in DHCP requests (don't tell the router who you are).
ipv4.dhcp-send-hostname=no
ipv6.dhcp-send-hostname=no
