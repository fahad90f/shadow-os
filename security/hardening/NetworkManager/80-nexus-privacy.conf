# NEXUS OS NetworkManager privacy defaults.
# Installed as /usr/lib/NetworkManager/conf.d/80-nexus-privacy.conf; override
# per connection (nmcli/Control Center) or with a file in /etc/NetworkManager/conf.d/.

[device]
# Random MAC address while scanning for networks.
wifi.scan-rand-mac-address=yes

[connection]
# A different, but stable, MAC address for every Wi-Fi network: networks
# cannot correlate this device between each other, while DHCP leases and
# captive-portal log-ins on a given network keep working. Networks that
# filter by hardware address need "permanent" set on their connection.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent
# IPv6 privacy extensions (temporary addresses preferred).
ipv6.ip6-privacy=2
