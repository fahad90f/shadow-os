# Shadow OS private DNS defaults (package shadow-hardening).
# Installed as /usr/lib/systemd/resolved.conf.d/80-shadow-privacy.conf.
#
# Do not edit this file: change the setting with
#     sudo shadow-netprivacy dns {dot|dot-strict|doh|off} [--provider ...]
# which writes /etc/systemd/resolved.conf.d/90-shadow-user.conf (that file
# wins over this one). "shadow-netprivacy status" shows what is in force.
# Turn it off for one boot with the kernel parameter shadow.netprivacy=off.
#
# What this does:
#   * every name is looked up through the provider below (Quad9), encrypted
#     with DNS-over-TLS on port 853 whenever the provider answers there;
#   * "Domains=~." sends every name to that provider, and not also, in
#     plain text, to the DNS server of the network you are connected to.
#     The network's own server is still asked for the network's own names
#     (its search domains, e.g. a router's "lan" or "home.arpa"). The
#     network chooses those itself (DHCP) and can claim any suffix, even a
#     whole top-level domain such as "com": names under it go to that
#     network's server, encrypted only if that server offers DNS-over-TLS;
#   * DNSSEC is checked where the answer is signed; an unsigned answer or a
#     network that breaks DNSSEC is accepted (allow-downgrade), because a
#     strict check fails behind many routers, captive portals and Tor;
#   * no fallback servers: if the provider cannot be reached, nothing else
#     is asked behind your back;
#   * the computer does not announce its name on the local network (LLMNR
#     and multicast DNS off).
#
# "opportunistic" means: encrypted when the provider answers on port 853,
# otherwise the query is sent in plain text to the same provider. An attacker
# on the network can force that fallback. "shadow-netprivacy dns dot-strict"
# never falls back (and names do not resolve on networks that block port 853).
#
# DNS= and Domains= are lists: an empty assignment first clears what an
# earlier file set, so this file always defines the complete list.

[Resolve]
DNS=
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
Domains=
Domains=~.
FallbackDNS=
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
