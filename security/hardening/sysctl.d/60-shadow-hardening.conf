# Shadow OS kernel hardening defaults (sysctl).
#
# Installed as /usr/lib/sysctl.d/60-shadow-hardening.conf. To change a value,
# do not edit this file: create /etc/sysctl.d/90-local.conf with the keys you
# want — files in /etc override it. Every setting is explained in
# docs/security/hardening.md together with what it can break.
#
# A leading '-' means "ignore if this kernel does not have the key".

# ---- kernel information leaks ------------------------------------------------
# Hide kernel pointers from everyone and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# ---- attack surface reachable by unprivileged users ---------------------------
# eBPF: no unprivileged use; harden the JIT for the privileged users that remain.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# perf_event_open(2) only for CAP_PERFMON (Debian carries the level-3 patch).
-kernel.perf_event_paranoid = 3
# userfaultfd is a common exploitation primitive; privileged use still works.
-vm.unprivileged_userfaultfd = 0
# No automatic loading of TTY line disciplines; no TIOCSTI keystroke injection.
-dev.tty.ldisc_autoload = 0
-dev.tty.legacy_tiocsti = 0
# Replacing the running kernel via kexec is disabled until the next boot.
kernel.kexec_load_disabled = 1

# ---- process isolation ---------------------------------------------------------
# A process may only ptrace its own descendants (debuggers started normally
# keep working; attaching to an unrelated process needs root).
kernel.yama.ptrace_scope = 1
# Setuid programs never dump core.
fs.suid_dumpable = 0
# Link and FIFO protections against /tmp races.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ---- memory ---------------------------------------------------------------------
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536
# Maximum ASLR entropy the architecture offers.
-vm.mmap_rnd_bits = 32
-vm.mmap_rnd_compat_bits = 16

# ---- magic SysRq: keep only sync, remount read-only and reboot ------------------
kernel.sysrq = 176

# ---- network: this machine is a host, not a router ------------------------------
# Loose reverse-path filtering: drops spoofed sources without breaking
# multi-homed and VPN set-ups (strict mode does).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# IPv6 privacy extensions: prefer temporary addresses for outgoing connections.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
