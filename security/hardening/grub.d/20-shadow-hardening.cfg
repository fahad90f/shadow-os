# Shadow OS kernel command line hardening (read by update-grub).
# Rationale and compatibility notes: docs/security/hardening.md.
#
#   slab_nomerge                  do not merge slab caches (limits heap-overflow reach)
#   init_on_alloc=1               zero memory on allocation (stops uninitialised-memory leaks)
#   page_alloc.shuffle=1          randomise the page allocator free lists
#   randomize_kstack_offset=on    per-syscall kernel stack offset randomisation
#   vsyscall=none                 remove the legacy fixed-address vsyscall page
#   audit=1                       audit from the first process on (auditd collects it)
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX slab_nomerge init_on_alloc=1 page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none audit=1 audit_backlog_limit=8192"
