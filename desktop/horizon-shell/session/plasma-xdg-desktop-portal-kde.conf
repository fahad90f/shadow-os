# Installed as
#   /usr/lib/systemd/user/plasma-xdg-desktop-portal-kde.service.d/50-shadow.conf
#
# xdg-desktop-portal-kde creates its ScreenCast, Screenshot, RemoteDesktop,
# GlobalShortcuts, Background and InputCapture back-ends only when
# XDG_CURRENT_DESKTOP is exactly "KDE" (src/desktopportal.cpp compares the
# whole value). The Shadow session is "SHADOW:KDE", so without this the KDE
# back-end silently offers no screen sharing and every share fails with
# "No such interface ...ScreenCast".
#
# Only this process is told "KDE": the portal front-end keeps "SHADOW:KDE" and
# so still reads shadow-portals.conf (which also switches off the KDE
# interfaces screen sharing does not need). D-Bus activation starts the
# back-end through this unit (SystemdService= in its D-Bus service file), and
# Environment= here wins over the value horizon-session-leader publishes. The
# program path stays the same, so KWin still recognises the portal by its
# desktop entry (X-KDE-Wayland-Interfaces).
[Service]
Environment=XDG_CURRENT_DESKTOP=KDE
