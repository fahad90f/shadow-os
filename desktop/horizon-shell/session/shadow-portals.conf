# xdg-desktop-portal back-ends for the Shadow Horizon session
# (XDG_CURRENT_DESKTOP=SHADOW:KDE; the front-end finds this file through the
# "shadow" entry). The KDE back-end talks to KWin for screenshots and screen
# sharing and provides the file chooser; the GTK back-end fills the interfaces
# the KDE one lacks.
#
# ScreenCast and Screenshot are pinned to the kde back-end; the gtk back-end
# does not implement them. The KDE back-end serves them only because
# plasma-xdg-desktop-portal-kde.service.d/50-shadow.conf starts it with
# XDG_CURRENT_DESKTOP=KDE.
#
# Switched off ("none") because screen sharing does not need them and the KDE
# back-end would otherwise offer them:
#   GlobalShortcuts - binds an application's preferred key without asking and
#     opens a System Settings page on every bind, which Shadow does not have
#     (an error pop-up in Discord and other applications);
#   RemoteDesktop, InputCapture - hand an application the keyboard and pointer
#     after a single dialog.
# Delete a line to offer that interface (remote-support tools such as RustDesk
# need RemoteDesktop).
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.InputCapture=none
