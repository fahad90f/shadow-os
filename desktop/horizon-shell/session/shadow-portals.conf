# xdg-desktop-portal back-ends for the Shadow Horizon session
# (XDG_CURRENT_DESKTOP=SHADOW:KDE). The KDE back-end talks to KWin for
# screenshots, screen sharing and global shortcuts and provides the file
# chooser; the GTK back-end fills the remaining interfaces.
#
# ScreenCast / RemoteDesktop / Screenshot are pinned to the kde back-end
# explicitly. The gtk back-end also advertises these interfaces but only
# works under GNOME/mutter, so if the portal ever picked it for a
# screen-share request on KWin the PipeWire capture would silently fail —
# a black frame or "nothing happens" in Discord, OBS, browsers, etc. Pinning
# them to kde routes every screen-share request to the back-end that actually
# drives KWin's PipeWire screencast.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.Screenshot=kde
