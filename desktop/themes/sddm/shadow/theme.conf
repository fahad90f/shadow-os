# Settings of the SHADOW login screen. Administrators override single keys in
# /usr/share/sddm/themes/shadow/theme.conf.user (same format).
[General]
# Picture behind the login screen. When the file is missing or unreadable
# the screen is drawn on the plain SHADOW background colour.
background=/usr/share/backgrounds/shadow/shadow-horizon.jpg
# Clock: empty = the time format of the system locale; otherwise a Qt format
# string such as "HH:mm" or "h:mm AP".
timeFormat=
# Ask for confirmation before restarting or shutting down.
confirmPower=true
