#
# Shadow OS defaults for the SDDM display manager.
# Installed as /usr/lib/sddm/sddm.conf.d/10-shadow.conf; files in
# /etc/sddm.conf.d/ and /etc/sddm.conf override it key by key.

[Theme]
Current=shadow
CursorTheme=breeze_cursors
CursorSize=24
Font=Inter Variable,10

[General]
# The greeter runs on Wayland, composited by KWin. Shadow OS ships KWin
# (Wayland) and Xwayland but no Xorg server, so SDDM's default "x11" (which
# starts /usr/bin/X) cannot work; "x11-user" needs Xorg as well. The login
# screen then also uses the compositor, GPU path and input stack of the
# session that follows, and no root-owned X server is left running.
DisplayServer=wayland
# layer-shell puts the greeter window on its output at full size (KWin has no
# other shell surface role that guarantees that); the platform theme is not
# wanted in the greeter.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_QPA_PLATFORMTHEME=
# The on-screen keyboard module (qtvirtualkeyboard) is not installed.
InputMethod=

[Wayland]
# --no-lockscreen: nothing to lock before login; --no-global-shortcuts: no
# session shortcuts on the login screen; --locale1: keyboard layout from the
# system configuration (/etc/default/keyboard through systemd-localed)
# instead of a per-user kxkbrc, so passwords are typed in the system layout.
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
