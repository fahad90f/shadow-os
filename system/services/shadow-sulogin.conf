# Shadow OS: rescue and emergency mode on a system whose root account is locked.
#
# Shadow OS locks the root password (administration goes through sudo), and
# sulogin refuses to open a shell for a locked root account — which would make
# "recovery mode" in the boot menu and the emergency shell useless exactly
# when they are needed. With this setting sulogin opens the root shell without
# asking for a password in that case.
#
# Security implication: anyone who can choose the recovery entry at the boot
# menu gets a root shell on an unencrypted installation. That person already
# has physical access to the machine and could equally boot other media;
# full-disk encryption (offered by the installer) is the protection against
# that, and with it the passphrase is still required before this shell exists.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
