# NEXUS OS distribution defaults for GRUB (do not edit; see /etc/default/grub).

# Remember nothing between boots: the default entry is always the newest kernel.
GRUB_SAVEDEFAULT=false

# Keep the recovery-mode entries: they are the documented way to repair a
# system that no longer reaches the desktop (docs/troubleshooting/recovery.md).
GRUB_DISABLE_RECOVERY=false

# Use the highest resolution the firmware offers and keep it for the kernel,
# so the boot splash appears without a mode switch.
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
