# Shadow OS live-session defaults, read by live-config at boot.
# Override on the kernel command line: live-config.username=…, live-config.hostname=…
LIVE_USERNAME="shadow"
LIVE_USER_FULLNAME="SHADOW Live Session"
LIVE_HOSTNAME="shadow"
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev bluetooth lpadmin sudo wireshark kvm render input"
