# Shadow OS live medium: log the live user straight into Shadow Horizon, with
# no greeter. Shipped by the shadow-live package and removed by the installer,
# so only the live session auto-logs in; the installed system shows the normal
# login. The 2000-shadow-session live-config hook rewrites this file at boot if
# the username was overridden on the kernel command line
# (live-config.username=…) or autologin was disabled (live-config.noautologin).
#
# Shipping it statically (rather than only writing it from the boot hook)
# guarantees the autologin is configured before SDDM starts, so SDDM cannot
# race ahead and present the greeter instead.
[Autologin]
User=shadow
Session=shadow-horizon
Relogin=false
