# Shadow OS live medium: hold the text login prompts until live-config has
# created the live user and set its password (the 2000-shadow-session
# component). Without this, a serial or VT getty can present "login:" before
# the password exists, so an early login attempt is rejected — which also made
# the automated desktop boot test fail at its serial login. The graphical path
# already waits (SDDM is ordered After live-config.service). Shipped only on
# the live medium by shadow-live; the installer removes it.
[Unit]
After=live-config.service
