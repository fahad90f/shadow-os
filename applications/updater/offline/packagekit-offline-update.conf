# PackageKit's offline-update service runs in every update boot, whoever
# prepared the update, and its unit restarts the machine when it fails, which
# it does when PackageKit itself prepared nothing. Started next to
# shadow-offline-update.service it could restart the computer in the middle of
# installing packages. So it runs only when PackageKit has prepared an update
# or a system upgrade ("|": either condition is enough).
[Unit]
ConditionPathExists=|/var/lib/PackageKit/prepared-update
ConditionPathExists=|/var/lib/PackageKit/prepared-upgrade
